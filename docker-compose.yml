# Stack local: docker compose up -d --build
# Variables en .env (copiar de .env.example). API en http://localhost:8080/api/v1
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - datos-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:1025:1025"   # SMTP, para la api corriendo fuera de compose
      - "127.0.0.1:8025:8025"   # bandeja web http://localhost:8025

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRETO: ${JWT_SECRETO}
      CORS_ORIGENES: ${CORS_ORIGENES}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      GESTOR_INICIAL_EMAIL: ${GESTOR_INICIAL_EMAIL:-}
      GESTOR_INICIAL_CONTRASENIA: ${GESTOR_INICIAL_CONTRASENIA:-}
      GESTOR_INICIAL_NOMBRE: ${GESTOR_INICIAL_NOMBRE:-}
      ARCHIVOS_DIR: /data/archivos
    volumes:
      - archivos:/data/archivos
    ports:
      - "8080:8080"

volumes:
  datos-db:
  archivos:
