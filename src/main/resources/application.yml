spring:
  application:
    name: servife
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/servife}
    username: ${DB_USER:servife}
    password: ${DB_PASSWORD:servife}
  jpa:
    # El esquema lo maneja Flyway. Nunca update (.ai/04-database-schema.md).
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USUARIO:}
    password: ${MAIL_CONTRASENIA:}
  jackson:
    time-zone: UTC
  # Mensajes de Bean Validation siempre en español, sin depender del Accept-Language del cliente.
  web:
    locale: es
    locale-resolver: fixed
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  servlet:
    context-path: /api/v1

servife:
  jwt:
    # Mínimo 32 caracteres (HS256). Nunca commitear el valor real.
    secreto: ${JWT_SECRETO}
    duracion-access: 15m
    duracion-refresh: 7d
  archivos:
    # Carpeta donde se guardan las imágenes subidas (en Docker, un volumen).
    directorio: ${ARCHIVOS_DIR:./archivos}
  correo:
    remitente: ${MAIL_REMITENTE:no-responder@servife.local}
  # Primer gestor: solo se crea si no hay ninguno. Vacío = no hace nada.
  gestor-inicial:
    email: ${GESTOR_INICIAL_EMAIL:}
    contrasenia: ${GESTOR_INICIAL_CONTRASENIA:}
    nombre: ${GESTOR_INICIAL_NOMBRE:}
  cors:
    origenes-permitidos: ${CORS_ORIGENES:http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
